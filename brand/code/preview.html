<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cognita 2.0 Brand Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./cognita-brand.css" />
<style>
*{box-sizing:border-box}body{margin:0;background:var(--cognita-soft-gray);font-family:var(--cognita-font-body)}main{max-width:1180px;margin:auto;padding:64px 24px}.hero{padding:64px;background:white;border:1px solid var(--cognita-border);border-radius:32px;box-shadow:var(--cognita-shadow-sm)}.logo{width:min(520px,100%)}.lede{max-width:650px;font-size:1.1rem}.swatches{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:32px}.swatch{background:white;border:1px solid var(--cognita-border);padding:14px;border-radius:16px}.chip{height:82px;border-radius:12px;margin-bottom:10px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
</style>
</head>
<body class="cognita-surface">
<main>
<section class="hero">
<img class="logo" src="../logos/cognita-lockup-formal.svg" alt="Cognita" />
<p class="cognita-eyebrow">Brand system 2.0</p>
<h1 class="cognita-display" style="font-size:clamp(2.6rem,7vw,5.5rem);margin:.2em 0">Human Intelligence. <span class="cognita-gradient-text">Amplified.</span></h1>
<p class="cognita-body lede">A clean institutional identity for practical AI education. White space and deep navy create trust; indigo, violet, and cyan introduce controlled technological energy.</p>
<div class="actions"><button class="cognita-button-primary">Explore programs</button><button class="cognita-button-accent">Student experience</button></div>
<div class="swatches">
<div class="swatch"><div class="chip" style="background:#071B3D"></div><strong>Deep Navy</strong><div>#071B3D</div></div>
<div class="swatch"><div class="chip" style="background:#4F46E5"></div><strong>Indigo</strong><div>#4F46E5</div></div>
<div class="swatch"><div class="chip" style="background:#A855F7"></div><strong>Violet</strong><div>#A855F7</div></div>
<div class="swatch"><div class="chip" style="background:#06B6D4"></div><strong>Cyan</strong><div>#06B6D4</div></div>
</div>
</section>
</main>
</body>
</html>

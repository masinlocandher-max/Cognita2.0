name: Cognita 2.0 Frontend CI

on:
  push:
    branches:
      - main
      - build/cognita-mvp-v2
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: cognita2-dist
          path: dist
          if-no-files-found: error
